<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Delingsbillede – Skolesager i Glostrup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@600;700&display=swap">
<style>
html, body { margin:0; width:1200px; height:630px; overflow:hidden; font-family:"Source Sans 3","Source Sans Pro",sans-serif; }
.card { width:1200px; height:630px; display:grid; grid-template-columns:504px 696px; }
.mark { background:#0b1f5a; display:flex; align-items:center; justify-content:center; }
.mark svg { width:312px; }
.text { background:#fff; display:flex; flex-direction:column; justify-content:center; padding:0 72px; }
.school { color:#5b6482; font-weight:600; font-size:34px; }
h1 { color:#0b1f5a; font-weight:700; font-size:76px; line-height:1.04; margin:10px 0 0; }
.rule { width:132px; height:10px; background:#f2a826; margin-top:44px; }
</style>
</head>
<body>
<div class="card">
  <div class="mark">
    <svg viewBox="0 0 89 55" xmlns="http://www.w3.org/2000/svg">
      <polygon fill="#F2A826" points="30 0 53 16 53 55 30 55"/>
      <polygon fill="#F2A826" points="0 16 24 0 24 55 0 55"/>
      <polygon fill="#32896A" transform="translate(74, 38) scale(-1, 1) translate(-74, -38)" points="59 39.3076923 74 21 89 39.3076923 89 55 59 55"/>
    </svg>
  </div>
  <div class="text">
    <div class="school">Nordvang-/Ejbyskolen</div>
    <h1>Skolesager<br>i Glostrup</h1>
    <div class="rule"></div>
  </div>
</div>
</body>
</html>
